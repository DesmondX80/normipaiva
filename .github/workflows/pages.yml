# Buildaa selainversion (Godotin Web-export) ja julkaisee sen GitHub Pagesiin jokaisesta mainin pushista.
# PR:issä vain buildataan, jotta rikkinäinen Web-export huomataan ennen mergeä. Käsin: Actions → Selainversio → Run workflow.
# Kertaluontoinen asetus (repon omistaja): Settings → Pages → Source: GitHub Actions.
#
# GitHub Pages ei salli COOP/COEP-otsakkeita, joten käytetään säikeetöntä templatea (Web-preset: thread_support=false).
name: Selainversio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Godot ja templatet välimuistista
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Lataa Godot ja Web-template
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot/templates
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # Templatepaketti on 1,3 Gt: puretaan vain tarvittavat.
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/web_nothreads_release.zip -d ~/godot/templates
          rm /tmp/templates.tpz /tmp/godot.zip

      - name: Asenna templatet
        run: |
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          cp ~/godot/templates/* "$dest/"

      - name: Tuo assetit
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          touch build/web/.nojekyll
          ls -la build/web

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
